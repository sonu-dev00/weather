<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weatherApp</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        
            <h2>weather App</h2>
                <form action="">
                    <label for="weather">Enter location</label>
                    <input type="text" name="weather" id="weather">
                    
                </form>
                <button id="searchBtn">search</button>
                <div id="weatherInfo">
                    <p id="address"></p>
                    <p id="temp"></p>
                    <p id="conditions"></p>
                    <p id="humidity"></p>
                    <p id="wind"></p>
                </div>
    </div>
</body>
</html>
